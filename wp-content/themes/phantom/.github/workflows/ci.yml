name: Phantom Core CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap (composer validate + PHP lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: composer validate
        # Non-strict: the intentional `version` field (semver policy) yields a
        # benign Packagist warning that would fail --strict. Validation still
        # fails hard on schema errors (exit != 0).
        run: composer validate --no-check-publish

      - name: composer install (dev)
        run: composer install --no-interaction --prefer-dist

      - name: composer dump-autoload (PSR-4, optimized)
        run: composer dump-autoload --optimize

      - name: PHP syntax check on app/
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP syntax check on functions.php
        run: php -l functions.php

  static-analysis:
    name: PHPCS + PHPStan + Psalm
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: composer install (dev)
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs

      - name: PHPStan level 5
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Psalm errorLevel 5
        run: vendor/bin/psalm --no-cache --no-progress

  assets:
    name: Vite + ESLint + Prettier + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Vite pinned version
        run: npx vite --version

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Vite build
        run: npm run build

  integrity:
    name: Parent-package integrity gate (ADR-004)
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      # Authoritative ONLY inside the monorepo checkout, where the GeneratePress
      # + GP Premium packages and the audited manifest live at the repo root.
      # In the isolated child-theme checkout the gate SKIPS with exit 0 and an
      # explicit message (never silently pretends verification happened). The
      # script resolves the package paths itself from the repo layout.
      - name: Verify GeneratePress + GP Premium byte-identical to baseline
        run: bash bin/verify-parent-integrity.sh
