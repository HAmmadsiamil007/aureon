<!DOCTYPE html>
<html lang="en" data-design="testclient">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Client — Checkout</title>
</head>
<body class="tc-active" data-template="checkout" data-client="testclient">
  <header class="tc-header">
    <div class="tc-header__logo">Test Client</div>
    <nav class="tc-header__nav">
      <a href="/" class="tc-header__nav-link">Home</a>
      <a href="/cart/" class="tc-header__nav-link">Cart</a>
      <a href="/checkout/" class="tc-header__nav-link tc-header__nav-link--active">Checkout</a>
    </nav>
  </header>

  <main class="tc-checkout">
    <h1 class="tc-checkout__title">Checkout</h1>
    <div class="tc-checkout__form">
      <div class="tc-checkout__section">
        <h2>Billing Information</h2>
        <input type="text" class="tc-account__input" placeholder="First Name" required>
        <input type="text" class="tc-account__input" placeholder="Last Name" required>
        <input type="email" class="tc-account__input" placeholder="Email" required>
      </div>
      <button class="tc-account__button">Place Order</button>
    </div>
  </main>

  <footer class="tc-footer">
    <div class="tc-footer__copyright">
      © 2026 Test Client — Isolation Verification Pack
    </div>
  </footer>

  <div id="tc-isolation-marker" data-client="testclient" data-page="checkout" style="display:none;">
    TESTCLIENT_CHECKOUT_ISOLATION_PROOF
  </div>
</body>
</html>
