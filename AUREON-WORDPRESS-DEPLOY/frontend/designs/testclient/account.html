<!DOCTYPE html>
<html lang="en" data-design="testclient">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Client — Account</title>
</head>
<body class="tc-active" data-template="account" data-client="testclient">
  <header class="tc-header">
    <div class="tc-header__logo">Test Client</div>
    <nav class="tc-header__nav">
      <a href="/" class="tc-header__nav-link">Home</a>
      <a href="/shop/" class="tc-header__nav-link">Shop</a>
      <a href="/my-account/" class="tc-header__nav-link tc-header__nav-link--active">Account</a>
    </nav>
  </header>

  <main class="tc-account">
    <h1 class="tc-account__title">My Account</h1>
    <form class="tc-account__form">
      <input type="email" class="tc-account__input" placeholder="Email" required>
      <input type="password" class="tc-account__input" placeholder="Password" required>
      <button type="submit" class="tc-account__button">Sign In</button>
    </form>
  </main>

  <footer class="tc-footer">
    <div class="tc-footer__copyright">
      © 2026 Test Client — Isolation Verification Pack
    </div>
  </footer>

  <div id="tc-isolation-marker" data-client="testclient" data-page="account" style="display:none;">
    TESTCLIENT_ACCOUNT_ISOLATION_PROOF
  </div>
</body>
</html>
