<!DOCTYPE html>
<html lang="en" data-design="testclient">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Client — Cart</title>
</head>
<body class="tc-active" data-template="cart" data-client="testclient">
  <header class="tc-header">
    <div class="tc-header__logo">Test Client</div>
    <nav class="tc-header__nav">
      <a href="/" class="tc-header__nav-link">Home</a>
      <a href="/shop/" class="tc-header__nav-link">Shop</a>
      <a href="/cart/" class="tc-header__nav-link tc-header__nav-link--active">Cart</a>
    </nav>
  </header>

  <main class="tc-cart">
    <h1 class="tc-cart__title">Shopping Cart</h1>
    <div class="tc-cart__items">
      <!-- Cart items will be populated by JS -->
    </div>
    <div class="tc-cart__total">
      Total: <span class="tc-cart__total-amount">€0.00</span>
    </div>
    <a href="/checkout/" class="tc-cart__checkout-button">Proceed to Checkout</a>
  </main>

  <footer class="tc-footer">
    <div class="tc-footer__copyright">
      © 2026 Test Client — Isolation Verification Pack
    </div>
  </footer>

  <div id="tc-isolation-marker" data-client="testclient" data-page="cart" style="display:none;">
    TESTCLIENT_CART_ISOLATION_PROOF
  </div>
</body>
</html>
