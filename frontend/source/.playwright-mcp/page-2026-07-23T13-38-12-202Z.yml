            - button "What makes AETHER different? " [expanded] [ref=f2e305] [cursor=pointer]:
              - generic [ref=f2e306]: What makes AETHER different?
              - generic [ref=f2e307]: 
            - paragraph [ref=f2e309]: AETHER combines carbon fiber plate technology with our proprietary Void Air cushioning system. Every shoe is engineered with aerospace-grade materials, delivering 40% more energy return than traditional running shoes while weighing only 280g.
          - generic [ref=f2e310]:
            - button "What is the return policy? +" [ref=f2e311] [cursor=pointer]:
              - generic [ref=f2e312]: What is the return policy?
              - generic [ref=f2e313]: +
            - paragraph [ref=f2e314]: We offer a 30-day no-questions-asked return policy. If you're not satisfied with your AETHER shoes, return them in original condition for a full refund. We also cover return shipping on all orders.
          - generic [ref=f2e315]:
            - button "How do I find my size? +" [ref=f2e316] [cursor=pointer]:
              - generic [ref=f2e317]: How do I find my size?
              - generic [ref=f2e318]: +
            - paragraph [ref=f2e319]: Each product page includes our interactive size guide. We recommend measuring your foot length and comparing it to our chart. Our adaptive lacing system accommodates a range of fits within each size.
        - generic [ref=f2e320]:
          - generic [ref=f2e321]:
            - button "How long does shipping take? +" [ref=f2e322] [cursor=pointer]:
              - generic [ref=f2e323]: How long does shipping take?
              - generic [ref=f2e324]: +
            - paragraph [ref=f2e325]: Standard shipping is free on orders over $200 and takes 3-5 business days. Express shipping (1-2 days) is available for $15. International shipping is available to 40+ countries with delivery in 5-10 business days.
          - generic [ref=f2e326]:
            - button "Are AETHER shoes sustainable? +" [ref=f2e327] [cursor=pointer]:
              - generic [ref=f2e328]: Are AETHER shoes sustainable?
              - generic [ref=f2e329]: +
            - paragraph [ref=f2e330]: Sustainability is core to AETHER. Our upper mesh uses 75% recycled materials, our packaging is 100% recyclable, and we offset 100% of carbon emissions from shipping. We're working toward a fully circular product by 2027.
          - generic [ref=f2e331]:
            - button "Do you offer warranty? +" [ref=f2e332] [cursor=pointer]:
