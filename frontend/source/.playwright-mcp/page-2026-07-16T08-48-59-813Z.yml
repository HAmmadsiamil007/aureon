    - main [ref=e82]:
      - heading "Who we are" [level=2] [ref=e83]
      - paragraph [ref=e84]:
        - strong [ref=e85]: "Suggested text:"
        - text: "Our website address is: http://localhost:8080."
      - heading "Comments" [level=2] [ref=e86]
      - paragraph [ref=e87]:
        - strong [ref=e88]: "Suggested text:"
        - text: When visitors leave comments on the site we collect the data shown in the comments form, and also the visitor’s IP address and browser user agent string to help spam detection.
      - paragraph [ref=e89]: "An anonymized string created from your email address (also called a hash) may be provided to the Gravatar service to see if you are using it. The Gravatar service privacy policy is available here: https://automattic.com/privacy/. After approval of your comment, your profile picture is visible to the public in the context of your comment."
      - heading "Media" [level=2] [ref=e90]
      - paragraph [ref=e91]:
        - strong [ref=e92]: "Suggested text:"
        - text: If you upload images to the website, you should avoid uploading images with embedded location data (EXIF GPS) included. Visitors to the website can download and extract any location data from images on the website.
      - heading "Cookies" [level=2] [ref=e93]
      - paragraph [ref=e94]:
        - strong [ref=e95]: "Suggested text:"
        - text: If you leave a comment on our site you may opt-in to saving your name, email address and website in cookies. These are for your convenience so that you do not have to fill in your details again when you leave another comment. These cookies will last for one year.
      - paragraph [ref=e96]: If you visit our login page, we will set a temporary cookie to determine if your browser accepts cookies. This cookie contains no personal data and is discarded when you close your browser.
      - paragraph [ref=e97]: When you log in, we will also set up several cookies to save your login information and your screen display choices. Login cookies last for two days, and screen options cookies last for a year. If you select "Remember Me", your login will persist for two weeks. If you log out of your account, the login cookies will be removed.
      - paragraph [ref=e98]: If you edit or publish an article, an additional cookie will be saved in your browser. This cookie includes no personal data and simply indicates the post ID of the article you just edited. It expires after 1 day.
      - heading "Embedded content from other websites" [level=2] [ref=e99]
      - paragraph [ref=e100]:
        - strong [ref=e101]: "Suggested text:"
        - text: Articles on this site may include embedded content (e.g. videos, images, articles, etc.). Embedded content from other websites behaves in the exact same way as if the visitor has visited the other website.
      - paragraph [ref=e102]: These websites may collect data about you, use cookies, embed additional third-party tracking, and monitor your interaction with that embedded content, including tracking your interaction with the embedded content if you have an account and are logged in to that website.
      - heading "Who we share your data with" [level=2] [ref=e103]
      - paragraph [ref=e104]:
        - strong [ref=e105]: "Suggested text:"
        - text: If you request a password reset, your IP address will be included in the reset email.
      - heading "How long we retain your data" [level=2] [ref=e106]
      - paragraph [ref=e107]:
        - strong [ref=e108]: "Suggested text:"
        - text: If you leave a comment, the comment and its metadata are retained indefinitely. This is so we can recognize and approve any follow-up comments automatically instead of holding them in a moderation queue.
      - paragraph [ref=e109]: For users that register on our website (if any), we also store the personal information they provide in their user profile. All users can see, edit, or delete their personal information at any time (except they cannot change their username). Website administrators can also see and edit that information.
      - heading "What rights you have over your data" [level=2] [ref=e110]
      - paragraph [ref=e111]:
        - strong [ref=e112]: "Suggested text:"
        - text: If you have an account on this site, or have left comments, you can request to receive an exported file of the personal data we hold about you, including any data you have provided to us. You can also request that we erase any personal data we hold about you. This does not include any data we are obliged to keep for administrative, legal, or security purposes.
      - heading "Where your data is sent" [level=2] [ref=e113]
      - paragraph [ref=e114]:
        - strong [ref=e115]: "Suggested text:"
        - text: Visitor comments may be checked through an automated spam detection service.
