name: Phantom Core CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Phantom theme lives at wp-content/themes/phantom — every step runs there.
defaults:
  run:
    working-directory: wp-content/themes/phantom

jobs:
  bootstrap:
    name: Bootstrap (composer validate + PHP lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: composer validate
        run: composer validate --no-check-publish

      - name: composer install (dev)
        run: composer install --no-interaction --prefer-dist

      - name: composer dump-autoload (PSR-4, optimized)
        run: composer dump-autoload --optimize

      - name: PHP syntax check on app/ + functions.php
        run: |
          find app -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l functions.php

      - name: Phase 1 bootstrap smoke suite (WP-free)
        run: php bin/smoke-phase1.php

      - name: Phase 2 framework smoke suite (WP-free)
        run: php bin/smoke-phase2.php

  static-analysis:
    name: PHPCS + PHPStan + Psalm
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: composer install (dev)
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs

      - name: PHPStan level 5
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Psalm errorLevel 5
        run: vendor/bin/psalm --no-cache --no-progress

  assets:
    name: Vite + ESLint + Prettier + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wp-content/themes/phantom/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Vite pinned version
        run: npx vite --version

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Vite build
        run: npm run build

  integrity:
    name: Parent-package integrity gate (ADR-004)
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Assert baseline + packages present (gate cannot silently skip)
        run: |
          test -f ../../../Report/gp_audit_manifest_new.txt
          test -d ../../../generatepress.3.6.1/generatepress
          test -d ../../../gp-premium_v2.5.6/gp-premium

      - name: Verify GeneratePress + GP Premium byte-identical to baseline
        run: bash bin/verify-parent-integrity.sh
