name: Aureon CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      web_base_url:
        description: 'Live WP stack base URL for the Playwright E2E job'
        required: true
        default: 'http://localhost:8080'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hermetic static gates — no live WordPress needed. Runs on every push/PR.
  static:
    name: Static gates (PHP lint + JS syntax + AETHER verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PHP syntax check (all tracked PHP: aureon theme + plugin + frontend)
        run: |
          set -e
          git ls-files '*.php' | while read -r f; do php -l "$f"; done

      - name: JS syntax check (all tracked JS outside node_modules/vendor)
        run: |
          set -e
          git ls-files '*.js' | grep -vE 'node_modules|/vendor/|/source/' | while read -r f; do node --check "$f"; done

      - name: AETHER frontend verification gate (verify.sh)
        run: bash frontend/tests/verify.sh

  # Live E2E against a real WP stack — opt-in only (workflow_dispatch).
  # Local equivalent: cd frontend/tests && WEB_BASE_URL=<url> npx playwright test
  # (uses installed Chrome channel; no browser download needed).
  e2e:
    name: Playwright E2E (live)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      WEB_BASE_URL: ${{ inputs.web_base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/tests/package-lock.json

      - name: npm ci
        working-directory: frontend/tests
        run: npm ci

      - name: Run Playwright suite
        working-directory: frontend/tests
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/tests/results/
          if-no-files-found: ignore